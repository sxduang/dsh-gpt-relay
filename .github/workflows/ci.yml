name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify extension bundles, syntax and tests
        run: node scripts/check.mjs
      - name: Inspect the tarball npm publish would upload
        run: |
          node scripts/build-extension.mjs --public
          npm pack --dry-run --json --ignore-scripts > pack.json
          node scripts/check-pack.mjs
