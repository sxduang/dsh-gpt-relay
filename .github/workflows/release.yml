name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the tag and the package version agree
        run: |
          node -e '
            const pkg = require("./package.json");
            const tag = process.env.GITHUB_REF_NAME || "";
            const want = "v" + pkg.version;
            if (pkg.private) { console.error("package.json is private"); process.exit(1); }
            if (tag.startsWith("v") && tag !== want) {
              console.error(`tag ${tag} does not match ${want}`); process.exit(1);
            }
            console.log(`releasing ${pkg.name}@${pkg.version}`);
          '

      - name: Run the checks
        run: node scripts/check.mjs

      - name: Build the public extension (no local token) and inspect the tarball
        run: |
          node scripts/build-extension.mjs --public
          npm pack --dry-run --json --ignore-scripts > pack.json
          node scripts/check-pack.mjs

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npm publish --provenance --access public --ignore-scripts

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
